name: Daily European market scan

# Sections 6, 66 and 72 of the market-intelligence brief.
#
# WHAT IT DOES ON A NORMAL DAY: nothing visible. There is no search-provider key
# in this repository and there must not be one, so the scan reports
# provider: not-configured, decides NO_PUBLISH, writes the run into
# data/market-signals.json and stops. That is the correct behaviour, not a
# failure: a scan that was not performed is reported as not performed.
#
# TO MAKE IT SCAN: set MODUNERA_SEARCH_PROVIDER and MODUNERA_SEARCH_KEY as
# repository secrets. Section 74 — no key is ever written into the source.
#
# It never publishes by itself. AUTO_PUBLISH_NEWS is not set here, so the run
# records a recommendation and a person acts on it.

on:
  schedule:
    # From data/market-scan-config.json, run.schedule_cron_utc. 04:35 UTC is
    # 07:35 Europe/Istanbul, and it lands before the daily post at 05:12 UTC so a
    # new article reaches the site the same morning.
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modunera-main-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan the five markets
        env:
          MODUNERA_SEARCH_PROVIDER: ${{ secrets.MODUNERA_SEARCH_PROVIDER }}
          MODUNERA_SEARCH_KEY: ${{ secrets.MODUNERA_SEARCH_KEY }}
        run: node tools/market-intelligence.mjs

      - name: Section 75 tests
        run: node tools/test-market-intelligence.mjs

      - name: Run the full pipeline, in the documented order
        run: |
          set -euo pipefail
          node tools/rebrand-modunera.mjs
          node tools/build-modunera-europe.mjs
          node tools/build-modunera-locales.mjs
          node tools/build-modunera-depth.mjs
          node tools/build-news-v7.mjs
          node tools/build-production-faq-v7.mjs
          node tools/build-daily-blog.mjs
          node tools/build-intelligence-dashboard.mjs
          node tools/build-modunera-v2.mjs
          node tools/build-modunera-depth.mjs --extend
          node tools/build-quality-spec.mjs
          node tools/build-hreflang-v7.mjs
          node tools/build-photo-placement.mjs
          node tools/build-image-attrs.mjs
          node tools/build-nordic-redirects.mjs
          node tools/build-title-lengths.mjs
          node tools/build-content-lastmod.mjs
          node tools/build-seo-governance-v7.mjs
          node tools/build-de-source-block.mjs
          node tools/build-shell-v3.mjs

      # Exit codes are observed directly. Piping a validator into grep makes the
      # shell observe grep's exit code instead of the validator's.
      - name: Gate — canonicals, JSON-LD, links, brand, colours
        run: node tools/validate-modunera.mjs

      - name: Gate — claims, sitemap, hreflang, schema, legal
        run: node tools/validate-seo-v7.mjs

      - name: The daily report
        run: cat build-report-market-intelligence.txt

      - name: Commit, only if something changed
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing changed. No commit."
            exit 0
          fi
          git config user.name "modunera-intelligence"
          git config user.email "noreply@modunera.com"
          git add -A
          git commit -m "Daily European market scan" -m "Generated by .github/workflows/market-intelligence.yml. Both validators passed before this commit was made. Publication of any candidate remains a person's decision."
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** attempt))
          done
          exit 1
