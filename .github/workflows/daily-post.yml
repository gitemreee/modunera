name: Publish the daily practice post

# There is no server. Netlify publishes the committed HTML, so a queued post in
# data/blog-daily-*.json becomes a page only when the pipeline runs on or after
# its publish_on date and the result is committed. This is what runs it.
#
# It commits only when the output actually changed, which on a normal day is one
# new post plus the sitemap and the lastmod file. On a day with nothing queued it
# changes nothing and commits nothing.
#
# Both gates run before anything is committed. If either fails, nothing is
# pushed — a broken build must not reach the site just because a date arrived.

on:
  schedule:
    # 05:12 UTC. Not on the hour: scheduled runs cluster there and get delayed.
    - cron: "12 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: What is queued for today
        run: node tools/build-daily-blog.mjs

      - name: Run the full pipeline, in the documented order
        run: |
          set -euo pipefail
          node tools/rebrand-modunera.mjs
          node tools/build-modunera-europe.mjs
          node tools/build-modunera-locales.mjs
          node tools/build-modunera-depth.mjs
          node tools/build-news-v7.mjs
          node tools/build-production-faq-v7.mjs
          node tools/build-daily-blog.mjs
          node tools/build-intelligence-dashboard.mjs
          node tools/build-modunera-v2.mjs
          node tools/build-modunera-depth.mjs --extend
          node tools/build-quality-spec.mjs
          node tools/build-hreflang-v7.mjs
          node tools/build-photo-placement.mjs
          node tools/build-image-attrs.mjs
          node tools/build-nordic-redirects.mjs
          node tools/build-title-lengths.mjs
          node tools/build-content-lastmod.mjs
          node tools/build-seo-governance-v7.mjs
          node tools/build-de-source-block.mjs
          node tools/build-shell-v3.mjs

      # Captured separately from any filtering. Piping a validator into grep makes
      # the shell observe grep's exit code instead of the validator's, and a
      # published breakage got through exactly that way once already.
      - name: Gate — canonicals, JSON-LD, links, brand, colours
        run: node tools/validate-modunera.mjs

      - name: Gate — claims, sitemap, hreflang, schema, legal
        run: node tools/validate-seo-v7.mjs

      - name: Commit, only if something changed
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing queued for today. No commit."
            exit 0
          fi
          git config user.name "modunera-daily"
          git config user.email "noreply@modunera.com"
          git add -A
          git commit -m "Publish the daily practice post" -m "Generated by .github/workflows/daily-post.yml from data/blog-daily-*.json. Both validators passed before this commit was made."
          git push origin main
